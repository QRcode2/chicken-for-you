<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Chicken For You</title>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 40px 20px;

  position: relative;
  overflow-x: hidden;

  background: linear-gradient(-45deg, #000000, #0a0a0a, #111111, #000000);
  background-size: 400% 400%;
  animation: backgroundMove 12s ease infinite;
}

/* خلفية متحركة */
@keyframes backgroundMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ===== لمعة قوية ===== */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;

  width: 180%;
  height: 100%;

  pointer-events: none;

  background: linear-gradient(
    120deg,
    transparent 0%,

    rgba(154,116,24,0.05) 20%,
    rgba(212,175,55,0.12) 40%,

    rgba(212,175,55,0.20) 50%,
    rgba(244,208,111,0.10) 55%,

    rgba(184,134,11,0.12) 60%,
    rgba(154,116,24,0.06) 70%,

    transparent 100%
  );

  transform: translateX(-180%) skewX(-20deg);
  animation: shimmerMove 3.2s linear infinite;

  z-index: 0;
}

@keyframes shimmerMove {
  0% { transform: translateX(-180%) skewX(-20deg); }
  100% { transform: translateX(180%) skewX(-20deg); }
}

/* المحتوى فوق اللمعة */
.container {
  position: relative;
  z-index: 2;
  max-width: 500px;
  margin: auto;
}

/* ===== LOGO ===== */
.logo {
  width:220px;
  height:220px;
  object-fit:cover;
  border-radius:50%;
  border:6px solid #D4AF37;

  background:none;
  padding:0;

  transition: all 0.4s ease;

  box-shadow:
    0 10px 30px rgba(0,0,0,0.6),
    0 0 30px rgba(212,175,55,0.6);
}

.logo:hover {
  transform: scale(1.05) rotate(1deg);
  box-shadow:
    0 15px 40px rgba(0,0,0,0.8),
    0 0 40px rgba(212,175,55,0.9);
}

h1 {
  font-size:36px;
  margin-bottom:5px;
  color:#ffffff;
}

.subtitle {
  font-size:18px;
  color:#ccc;
  margin-bottom:30px;
}

/* ===== BUTTONS ===== */
.link-button {
  position: relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px 20px;

  background: linear-gradient(145deg, #F4D06F, #D4AF37, #9A7418);
  color:black;

  text-decoration:none;
  font-size:18px;
  border-radius:18px;
  margin:14px auto;
  max-width:420px;

  overflow: hidden;

  transition: all 0.35s ease;

  border: 1px solid rgba(255,255,255,0.3);
  outline: 1px solid rgba(0,0,0,0.4);

  box-shadow:
    0 10px 25px rgba(0,0,0,0.5),
    inset 0 2px 6px rgba(255,255,255,0.35),
    inset 0 -4px 8px rgba(0,0,0,0.3);
}

/* shine */
.link-button::before {
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:70%;
  height:100%;

  background: linear-gradient(
    120deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,0.55) 40%,
    rgba(212,175,55,0.6) 50%,
    rgba(200,200,200,0.6) 55%,
    rgba(255,255,255,0.50) 60%,
    rgba(255,255,255,0) 100%
  );

  transform: skewX(-25deg);
  transition: 0.6s;
}

.link-button:hover::before {
  left:150%;
}

.link-button:hover {
  transform: translateY(-6px) scale(1.05);
  box-shadow:
    0 25px 50px rgba(0,0,0,0.85),
    inset 0 3px 12px rgba(255,255,255,0.45);
}

.link-button:active {
  transform: scale(0.96);
}

.link-button img {
  width:22px;
  height:22px;
  margin-right:15px;
  filter: brightness(0) invert(1);
}

.link-button span {
  display:block;
  width:100%;
  text-align:center;
  color:#fff;
  font-weight:600;
  white-space:nowrap;
}

/* ===== زر + (FAB) ===== */
.vcard-btn {
  position: fixed;
  bottom: 25px;
  left: 25px;

  width: 65px;
  height: 65px;
  border-radius: 50%;

  background: linear-gradient(145deg, #F4D06F, #D4AF37);
  color: #fff;

  font-size: 36px;
  font-weight: bold;

  border: none;
  cursor: pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:
    0 12px 30px rgba(0,0,0,0.6),
    inset 0 2px 6px rgba(255,255,255,0.35);

  transition: 0.3s;

  z-index: 9999; /* 🔥 فوق كل العناصر */
}

/* موبايل */
@media (max-width: 768px) {
  .vcard-btn {
    bottom: 20px;
    left: 20px;
    z-index: 99999;
  }
}

.vcard-btn:hover {
  transform: scale(1.15);
  box-shadow: 0 25px 55px rgba(0,0,0,0.9);
}

.vcard-btn:active {
  transform: scale(0.95);
}


.button-icon {
  position: absolute !important;
  left: 20px !important;
  top: 50%;
  transform: translateY(-50%);
  width: 22px;
  height: 22px;
  margin: 0 !important;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
}
.button-icon svg {
  width: 22px;
  height: 22px;
  display: block;
}


@media (max-width: 768px) {
  .link-button {
    padding-left: 52px;
    padding-right: 52px;
  }
  .button-icon {
    left: 18px !important;
  }
}


/* ===== LOGO SOFT GLOW ===== */
.logo {
  animation: logoGlow 3.6s ease-in-out infinite;
}

@keyframes logoGlow {
  0%, 100% {
    box-shadow:
      0 10px 30px rgba(0,0,0,0.6),
      0 0 22px rgba(212,175,55,0.45);
  }
  50% {
    box-shadow:
      0 10px 30px rgba(0,0,0,0.6),
      0 0 34px rgba(212,175,55,0.72);
  }
}


/* Keep Arabic first and German second on every screen size */
.link-button > span:not(.button-icon) {
  direction: ltr;
  unicode-bidi: isolate;
  text-align: center;
  white-space: nowrap;
}



.logo-wrap { margin: 0 auto 12px; }
</style>
</head>
